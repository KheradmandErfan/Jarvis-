<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070a;
    --bg-deep: #020304;
    --ember: #ff8a2b;
    --ember-hot: #ffc266;
    --ember-dim: #7a3d10;
    --ring-track: #1c1408;
    --text: #f3ead9;
    --text-dim: #a68f6e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 30%, #0d0704 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text);
    font-family:'Rajdhani',sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    padding:24px;
  }

  /* ---------- top status bar ---------- */
  .status-bar{
    position:absolute;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:28px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    color: var(--text-dim);
  }
  .status-bar span.value{ color: var(--ember-hot); }

  /* ---------- reactor core ---------- */
  .reactor-wrap{
    position:relative;
    width:min(72vw, 420px);
    height:min(72vw, 420px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }

  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--ring-track);
  }
  .ring--outer{
    inset:0;
    border-color:#221407;
    animation: spin 40s linear infinite;
  }
  .ring--outer::before, .ring--outer::after{
    content:"";
    position:absolute;
    width:6px; height:6px;
    background: var(--ember-dim);
    border-radius:50%;
    top:-3px; left:calc(50% - 3px);
  }
  .ring--outer::after{ top:auto; bottom:-3px; }

  .ring--dashed{
    inset:9%;
    border:2px dashed var(--ember-dim);
    animation: spin-rev 26s linear infinite;
    opacity:.55;
  }

  .ring--tick{
    inset:18%;
    animation: spin 60s linear infinite;
  }
  .ring--tick svg{ width:100%; height:100%; display:block; }

  .core{
    position:absolute;
    inset:30%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 45%, var(--ember-hot) 0%, var(--ember) 38%, #3a1c06 78%, transparent 100%);
    box-shadow:
      0 0 30px 6px rgba(255,138,43,.55),
      0 0 90px 30px rgba(255,138,43,.22),
      inset 0 0 20px rgba(255,255,255,.25);
    animation: breathe 3.2s ease-in-out infinite;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .core-inner{
    width:38%;
    height:38%;
    border-radius:50%;
    background: radial-gradient(circle, #fff4df 0%, var(--ember-hot) 55%, transparent 100%);
    filter: blur(0.3px);
  }

  .reactor-wrap.listening .core{
    animation: breathe-fast 1s ease-in-out infinite;
  }
  .reactor-wrap.listening .ring--dashed{
    animation-duration: 8s;
    opacity:.9;
  }
  .reactor-wrap.speaking .core{
    animation: breathe-fast .55s ease-in-out infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes spin-rev{ to{ transform: rotate(-360deg); } }
  @keyframes breathe{
    0%,100%{ transform: scale(1); filter:brightness(1); }
    50%{ transform: scale(1.035); filter:brightness(1.15); }
  }
  @keyframes breathe-fast{
    0%,100%{ transform: scale(1); filter:brightness(1); }
    50%{ transform: scale(1.09); filter:brightness(1.3); }
  }

  /* ---------- caption / readout ---------- */
  .readout{
    margin-top:36px;
    min-height:64px;
    max-width:560px;
    text-align:center;
  }
  .readout .label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    color: var(--ember-dim);
    margin-bottom:6px;
  }
  .readout .line{
    font-size:19px;
    font-weight:500;
    color: var(--text);
    line-height:1.4;
  }
  .readout .line.dim{ color: var(--text-dim); font-size:15px; }

  .hint{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color: var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.05em;
    text-align:center;
    max-width:80vw;
  }

  .unsupported{
    position:absolute;
    inset:0;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    font-size:16px;
    color: var(--text-dim);
    z-index:50;
  }

  .error-banner{
    position:absolute;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    max-width:80vw;
    background: rgba(120,20,10,.18);
    border:1px solid #7a2a10;
    color:#ffb499;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:4px;
    text-align:center;
    display:none;
  }

  .top-right-controls{
    position:absolute;
    top:20px;
    right:18px;
    display:flex;
    gap:6px;
  }

  .top-left-controls{
    position:absolute;
    top:20px;
    left:18px;
    display:flex;
    gap:6px;
  }

  .gear-btn{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid var(--ember-dim);
    background:transparent;
    color: var(--text-dim);
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gear-btn:hover{ color: var(--ember-hot); border-color: var(--ember-hot); }
  .gear-btn.active{
    color: var(--bg);
    background: var(--ember-hot);
    border-color: var(--ember-hot);
  }

  .thinking-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--ember-hot);
    margin-left:4px;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:.2;} 50%{opacity:1;} }

  .text-input-row{
    margin-top:22px;
    display:flex;
    gap:8px;
    width:min(90vw, 420px);
  }
  .text-input-row input{
    flex:1;
    background: rgba(255,255,255,.03);
    border:1px solid var(--ring-track);
    border-radius:6px;
    padding:10px 12px;
    color: var(--text);
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    outline:none;
  }
  .text-input-row input:focus{ border-color: var(--ember-dim); }
  .text-input-row input::placeholder{ color:#5c503d; }
  .text-input-row button{
    width:42px;
    border-radius:6px;
    border:1px solid var(--ember-dim);
    background:transparent;
    color: var(--ember-hot);
    font-size:16px;
    cursor:pointer;
  }
  .text-input-row button:hover{ background: var(--ember-dim); }

  .confirm-box{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:22px;
    padding:16px 20px;
    max-width:min(90vw, 460px);
    border:1px solid var(--ember-dim);
    border-radius:8px;
    background: rgba(255,138,43,.06);
  }
  .confirm-box .confirm-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color: var(--ember-dim);
  }
  .confirm-box .confirm-text{
    text-align:center;
    font-size:17px;
    color: var(--text);
  }
  .confirm-actions{ display:flex; gap:14px; }
  .confirm-btn{
    padding:8px 22px;
    border-radius:6px;
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    border:1px solid;
  }
  .confirm-btn.yes{
    background: var(--ember);
    border-color: var(--ember);
    color: #1a0e04;
  }
  .confirm-btn.no{
    background:transparent;
    border-color: var(--text-dim);
    color: var(--text-dim);
  }

  .gear-btn.lang-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:.02em;
  }

  .commands-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(2,3,4,.78);
    z-index:60;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .commands-panel{
    width:min(92vw, 480px);
    max-height:80vh;
    overflow-y:auto;
    background: var(--bg-deep);
    border:1px solid var(--ember-dim);
    border-radius:10px;
    padding:20px 22px;
  }
  .commands-panel h2{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:.14em;
    color: var(--ember-hot);
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .commands-panel h2 .close-x{
    cursor:pointer;
    color: var(--text-dim);
    font-size:16px;
    line-height:1;
  }
  .commands-panel h2 .close-x:hover{ color: var(--ember-hot); }
  .cmd-item{
    padding:9px 0;
    border-bottom:1px solid #14100a;
  }
  .cmd-item:last-child{ border-bottom:none; }
  .cmd-item .cmd-en{
    font-size:14.5px;
    color: var(--text);
    font-weight:500;
  }
  .cmd-item .cmd-fa{
    font-size:13px;
    color: var(--text-dim);
    margin-top:2px;
    direction:rtl;
    text-align:right;
  }
</style>
</head>
<body>

  <div class="top-left-controls">
    <button class="gear-btn" id="pinBtn" title="Secure Panel">⚙</button>
    <button class="gear-btn" id="commandsBtn" title="لیست دستورات / Commands list">☰</button>
  </div>

  <div class="top-right-controls">
    <button class="gear-btn lang-btn" id="langToggleBtn" title="زبان تشخیص گفتار / Recognition language">EN</button>
    <button class="gear-btn active" id="confirmToggleBtn" title="تأیید قبل از اجرا">✓</button>
    <button class="gear-btn" id="gearBtn" title="API Key">⚙</button>
  </div>

  <div class="status-bar">
    <div>SYS <span class="value" id="sysState">STANDBY</span></div>
    <div>MIC <span class="value" id="micState">OFF</span></div>
    <div>CLOCK <span class="value" id="clockVal">--:--:--</span></div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="reactor-wrap" id="reactor">
    <div class="ring ring--outer"></div>
    <div class="ring ring--dashed"></div>
    <div class="ring ring--tick">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#2a1a0a" stroke-width="1" stroke-dasharray="1 4.2"/>
      </svg>
    </div>
    <div class="core"><div class="core-inner"></div></div>
  </div>

  <div class="readout">
    <div class="label">READOUT</div>
    <div class="line" id="mainLine">آماده‌ام، آقای استارک.</div>
    <div class="line dim" id="subLine"></div>
  </div>

  <div class="confirm-box" id="confirmBox">
    <div class="confirm-label">CONFIRM COMMAND</div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button class="confirm-btn yes" id="confirmYes">✓ Yes</button>
      <button class="confirm-btn no" id="confirmNo">✗ No</button>
    </div>
  </div>

  <div class="text-input-row">
    <input type="text" id="textCmdInput" placeholder="یا اینجا تایپ کن...">
    <button id="textCmdSend">➤</button>
  </div>

  <div class="commands-overlay" id="commandsOverlay">
    <div class="commands-panel">
      <h2><span>COMMANDS / دستورات</span><span class="close-x" id="commandsClose">✕</span></h2>
      <div id="commandsList"></div>
    </div>
  </div>

  <script>
    const reactor   = document.getElementById('reactor');
    const mainLine  = document.getElementById('mainLine');
    const subLine   = document.getElementById('subLine');
    const micState  = document.getElementById('micState');
    const sysState  = document.getElementById('sysState');
    const clockVal  = document.getElementById('clockVal');

    // ---- live clock ----
    function tickClock(){
      const d = new Date();
      clockVal.textContent = d.toLocaleTimeString('en-GB');
    }
    setInterval(tickClock, 1000);
    tickClock();

    function randomPick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

    const HOW_ARE_YOU_REPLIES = [
      "I'm doing well, thank you for asking.",
      "All systems are running smoothly, sir.",
      "Can't complain, my arc reactor's at full charge.",
      "Better now that you're here.",
      "Never better — systems nominal across the board.",
      "I'm operating at peak efficiency, thanks for asking.",
      "Just fine, though I could use a bit more processing power.",
      "Running like a well-oiled reactor, sir.",
      "I'm great — no errors in the log today.",
      "Doing well. How about you?"
    ];
    const HOW_ARE_YOU_DOING_REPLIES = [
      "Standing by and ready for your command, sir.",
      "Always at your service.",
      "Fully operational and awaiting instructions.",
      "Everything's running perfectly on my end.",
      "Diagnostics all green, ready when you are.",
      "Just keeping the lights on and the systems humming.",
      "Doing great — say the word and I'm on it.",
      "All circuits nominal, sir.",
      "Steady as ever, awaiting your next move.",
      "Doing well, thanks for checking in."
    ];
    const WHATS_UP_REPLIES = [
      "Not much, just keeping systems online. I'm good, thanks!",
      "All good here, thanks for asking!",
      "Just monitoring things as usual — I'm good, thanks.",
      "Nothing much, all systems steady. I'm doing well, thanks!",
      "I'm good, thanks! Just here running diagnostics.",
      "Not a lot — everything's calm and I'm doing fine, thanks.",
      "I'm good, thank you! Just waiting for your next command.",
      "All quiet on my end. I'm doing well, thanks for asking!",
      "Just cruising along — I'm good, thanks!",
      "Nothing new, I'm doing great, thanks for checking in!"
    ];
    const RAINBOW_COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet'];

    // ---- error banner ----
    const errorBanner = document.getElementById('errorBanner');
    function showError(msg){
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }
    function clearError(){
      errorBanner.style.display = 'none';
    }

    // ---- logging (on-screen history panel removed; kept as a no-op so
    // existing call sites don't need to change) ----
    function log(role, text){ /* intentionally empty */ }

    // ---- language helper ----
    function isPersian(text){ return /[\u0600-\u06FF]/.test(text); }

    // ---- speech synthesis ----
    function speak(text){
      mainLine.textContent = text;
      if (!('speechSynthesis' in window)) { return; }
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.02;
      utter.pitch = 0.85;
      utter.lang = 'en-US';
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => /en-GB|en-US/.test(v.lang) && /male|daniel|david|alex/i.test(v.name))
                      || voices.find(v => /en-GB/.test(v.lang))
                      || voices.find(v => /en/.test(v.lang));
      if (preferred) utter.voice = preferred;

      reactor.classList.add('speaking');
      utter.onend = () => reactor.classList.remove('speaking');
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // ---- confirm-before-execute toggle ----
    let confirmMode = true;
    const confirmToggleBtn = document.getElementById('confirmToggleBtn');
    confirmToggleBtn.addEventListener('click', () => {
      confirmMode = !confirmMode;
      confirmToggleBtn.classList.toggle('active', confirmMode);
      confirmToggleBtn.title = confirmMode ? 'تأیید قبل از اجرا: روشن' : 'تأیید قبل از اجرا: خاموش';
    });

    const confirmBox  = document.getElementById('confirmBox');
    const confirmText = document.getElementById('confirmText');
    const confirmYes  = document.getElementById('confirmYes');
    const confirmNo   = document.getElementById('confirmNo');
    let pendingConfirmText = null;
    let voiceAccum = '';

    function askConfirmation(text){
      pendingConfirmText = text;
      confirmText.textContent = `«${text}»`;
      confirmBox.style.display = 'flex';
    }

    // Stops the listening chain and either runs the accumulated command or discards it.
    function finalizeCapture(execute){
      listeningSession = false;
      try { recognition && recognition.stop(); } catch (e) {}
      confirmBox.style.display = 'none';
      const text = voiceAccum;
      voiceAccum = '';
      pendingConfirmText = null;
      if (execute && text) handleCommand(text);
    }

    confirmYes.addEventListener('click', () => finalizeCapture(true));
    confirmNo.addEventListener('click', () => {
      finalizeCapture(false);
      mainLine.textContent = 'لغو شد.';
    });

    // Removes duplicated command keywords (search/for/open/jarvis) and duplicated
    // content words caused by the device re-hearing the same audio across chained
    // restarts, then rebuilds a clean "search for X" / "open X" style command.
    function cleanVoiceCommand(raw){
      const words = raw.trim().split(/\s+/);
      let action = null;
      const contentWords = [];
      const seen = new Set();

      for (const w of words) {
        const lw = w.toLowerCase().replace(/[^a-z'\u0600-\u06FF]/g, '');
        if (!lw) continue;
        if (['jarvis', 'hey', 'ok', 'okay', 'جارویس', 'هی', 'اوکی'].includes(lw)) continue;
        if (lw === 'search' || lw === 'open' || lw === 'launch') {
          if (!action) action = (lw === 'launch') ? 'open' : lw;
          continue;
        }
        if (lw === 'for' && action === 'search') continue;
        if (seen.has(lw)) continue;
        seen.add(lw);
        contentWords.push(w);
      }

      if (action && contentWords.length) {
        const query = contentWords.join(' ');
        return action === 'search' ? `search for ${query}` : `open ${query}`;
      }
      return contentWords.join(' ');
    }

    function stripWake(text){
      return text.toLowerCase().trim()
        .replace(/^(hey |ok |okay )?jarvis[,.\s]*/i, '')
        .replace(/^(هی |اوکی )?جارویس[،,.\s]*/, '')
        .trim();
    }

    // ---- typed command input ----
    const textCmdInput = document.getElementById('textCmdInput');
    const textCmdSend  = document.getElementById('textCmdSend');
    function sendTypedCommand(){
      const val = textCmdInput.value.trim();
      if (!val) return;
      textCmdInput.value = '';
      handleCommand(val);
    }
    textCmdSend.addEventListener('click', sendTypedCommand);
    textCmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendTypedCommand();
    });

    // ---- secure panel (top-left button) ----
    const pinBtn = document.getElementById('pinBtn');
    pinBtn.addEventListener('click', () => {
      const entered = prompt('پین ۴ رقمی رو وارد کن:');
      if (entered !== null) {
        if (entered.trim() === '3392') {
          alert('پوچ! فکر کردی خیلی زرنگی نه؟');
        } else {
          alert('پین اشتباه وارد شد.');
        }
      }
    });

    // ---- recognition language toggle (EN / FA) ----
    let recogLang = 'en-US';
    const langToggleBtn = document.getElementById('langToggleBtn');
    langToggleBtn.addEventListener('click', () => {
      recogLang = (recogLang === 'en-US') ? 'fa-IR' : 'en-US';
      langToggleBtn.textContent = (recogLang === 'en-US') ? 'EN' : 'FA';
      langToggleBtn.title = (recogLang === 'en-US')
        ? 'زبان تشخیص گفتار: انگلیسی'
        : 'زبان تشخیص گفتار: فارسی';
      if (recognition) recognition.lang = recogLang;
    });

    // ---- commands list panel ----
    const COMMANDS_LIST = [
      { en: '"Jarvis" — wake word', fa: '«جارویس» — کلمه‌ی بیدارباش' },
      { en: 'Open "<app name>"', fa: 'باز کن «نام برنامه»' },
      { en: 'Search for "<query>"', fa: 'جستجو کن «عبارت»' },
      { en: 'What time is it?', fa: 'ساعت چنده؟' },
      { en: 'What time is it in "<place>"?', fa: 'ساعت «مکان» چنده؟' },
      { en: 'What date is it? (Gregorian + Persian + Islamic)', fa: 'امروز چه تاریخیه؟ (میلادی + شمسی + قمری)' },
      { en: 'Translate "<word>" to "<language>"', fa: 'ترجمه کن «کلمه» به «زبان»' },
      { en: 'Translate "<word>" (auto-detects EN⇄FA)', fa: 'ترجمه کن «کلمه» (تشخیص خودکار فارسی/انگلیسی)' },
      { en: 'How are you?', fa: 'حالت چطوره؟' },
      { en: "What's up?", fa: 'چه خبرا؟' },
      { en: "What's your favorite color?", fa: 'رنگ مورد علاقت چیه؟' },
      { en: "What's your name?", fa: 'اسمت چیه؟' },
      { en: "Who's your developer?", fa: 'سازنده‌ات کیه؟' },
      { en: 'Capital of Iran?', fa: 'پایتخت ایران کجاست؟' },
      { en: "Let's play rock, paper, scissors!", fa: 'بیا سنگ کاغذ قیچی بازی کنیم!' },
      { en: 'Anything else → answered by AI / web', fa: 'هر چیز دیگه → با هوش مصنوعی یا جستجوی وب جواب داده می‌شه' },
      { en: 'Note: commands can be given in Persian or English, but Jarvis always answers out loud in English', fa: 'توجه: دستور می‌تونه فارسی یا انگلیسی باشه، ولی جارویس همیشه با صدای انگلیسی جواب می‌ده' }
    ];
    const commandsOverlay = document.getElementById('commandsOverlay');
    const commandsList    = document.getElementById('commandsList');
    const commandsBtn     = document.getElementById('commandsBtn');
    const commandsClose   = document.getElementById('commandsClose');
    commandsList.innerHTML = COMMANDS_LIST.map(c =>
      `<div class="cmd-item"><div class="cmd-en">${c.en}</div><div class="cmd-fa">${c.fa}</div></div>`
    ).join('');
    commandsBtn.addEventListener('click', () => { commandsOverlay.style.display = 'flex'; });
    commandsClose.addEventListener('click', () => { commandsOverlay.style.display = 'none'; });
    commandsOverlay.addEventListener('click', (e) => {
      if (e.target === commandsOverlay) commandsOverlay.style.display = 'none';
    });

    // ---- translation ----
    const LANGUAGES = {
      english: { code:'en', en:'English', fa:'انگلیسی' },
      persian: { code:'fa', en:'Persian', fa:'فارسی' },
      farsi:   { code:'fa', en:'Persian', fa:'فارسی' },
      spanish: { code:'es', en:'Spanish', fa:'اسپانیایی' },
      french:  { code:'fr', en:'French', fa:'فرانسوی' },
      german:  { code:'de', en:'German', fa:'آلمانی' },
      arabic:  { code:'ar', en:'Arabic', fa:'عربی' },
      turkish: { code:'tr', en:'Turkish', fa:'ترکی' },
      italian: { code:'it', en:'Italian', fa:'ایتالیایی' },
      russian: { code:'ru', en:'Russian', fa:'روسی' },
      chinese: { code:'zh-CN', en:'Chinese', fa:'چینی' },
      japanese:{ code:'ja', en:'Japanese', fa:'ژاپنی' },
      korean:  { code:'ko', en:'Korean', fa:'کره‌ای' },
      portuguese:{ code:'pt', en:'Portuguese', fa:'پرتغالی' },
      hindi:   { code:'hi', en:'Hindi', fa:'هندی' },
      urdu:    { code:'ur', en:'Urdu', fa:'اردو' },
      'فارسی':      { code:'fa', en:'Persian', fa:'فارسی' },
      'انگلیسی':    { code:'en', en:'English', fa:'انگلیسی' },
      'اسپانیایی':  { code:'es', en:'Spanish', fa:'اسپانیایی' },
      'فرانسوی':    { code:'fr', en:'French', fa:'فرانسوی' },
      'آلمانی':     { code:'de', en:'German', fa:'آلمانی' },
      'عربی':       { code:'ar', en:'Arabic', fa:'عربی' },
      'ترکی':       { code:'tr', en:'Turkish', fa:'ترکی' },
      'ایتالیایی':  { code:'it', en:'Italian', fa:'ایتالیایی' },
      'روسی':       { code:'ru', en:'Russian', fa:'روسی' },
      'چینی':       { code:'zh-CN', en:'Chinese', fa:'چینی' },
      'ژاپنی':      { code:'ja', en:'Japanese', fa:'ژاپنی' },
      'کره‌ای':      { code:'ko', en:'Korean', fa:'کره‌ای' },

    };

    async function translateWord(word, targetName){
      let lang = targetName ? LANGUAGES[targetName.toLowerCase().trim()] : null;
      if (!lang) {
        lang = isPersian(word)
          ? { code:'en', en:'English', fa:'انگلیسی' }
          : { code:'fa', en:'Persian', fa:'فارسی' };
      }
      mainLine.innerHTML = 'Translating<span class="thinking-dot"></span>';
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(lang.code)}&dt=t&q=${encodeURIComponent(word)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        const translated = ((data && data[0]) || []).map(seg => seg[0]).join('').trim();
        if (!translated) throw new Error('empty');
        speak(`${word} means ${translated} in ${lang.en}.`);
      } catch (err) {
        speak("Sorry, I couldn't translate that.");
      }
    }

    // ---- Persian (Jalali) calendar, spelled out in English ----
    const JALALI_MONTHS = ['Farvardin','Ordibehesht','Khordad','Tir','Mordad','Shahrivar','Mehr','Aban','Azar','Dey','Bahman','Esfand'];
    function formatJalaliEnglish(d){
      try {
        const parts = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { day:'numeric', month:'numeric', year:'numeric' }).formatToParts(d);
        const day   = parts.find(p => p.type === 'day').value;
        const month = parseInt(parts.find(p => p.type === 'month').value, 10);
        const year  = parts.find(p => p.type === 'year').value;
        return `${day} ${JALALI_MONTHS[month - 1]} ${year}`;
      } catch (e) {
        return 'unavailable';
      }
    }

    // ---- world clock ----
    const TIMEZONE_MAP = {
      iran:'Asia/Tehran', tehran:'Asia/Tehran', 'ایران':'Asia/Tehran', 'تهران':'Asia/Tehran',
      usa:'America/New_York', america:'America/New_York', 'new york':'America/New_York',
      'آمریکا':'America/New_York', 'نیویورک':'America/New_York',
      london:'Europe/London', uk:'Europe/London', england:'Europe/London', 'لندن':'Europe/London', 'انگلیس':'Europe/London',
      paris:'Europe/Paris', france:'Europe/Paris', 'پاریس':'Europe/Paris', 'فرانسه':'Europe/Paris',
      berlin:'Europe/Berlin', germany:'Europe/Berlin', 'برلین':'Europe/Berlin', 'آلمان':'Europe/Berlin',
      moscow:'Europe/Moscow', russia:'Europe/Moscow', 'مسکو':'Europe/Moscow', 'روسیه':'Europe/Moscow',
      tokyo:'Asia/Tokyo', japan:'Asia/Tokyo', 'توکیو':'Asia/Tokyo', 'ژاپن':'Asia/Tokyo',
      beijing:'Asia/Shanghai', china:'Asia/Shanghai', 'پکن':'Asia/Shanghai', 'چین':'Asia/Shanghai',
      seoul:'Asia/Seoul', korea:'Asia/Seoul', 'سئول':'Asia/Seoul', 'کره':'Asia/Seoul',
      dubai:'Asia/Dubai', uae:'Asia/Dubai', 'دبی':'Asia/Dubai', 'امارات':'Asia/Dubai',
      istanbul:'Europe/Istanbul', turkey:'Europe/Istanbul', 'استانبول':'Europe/Istanbul', 'ترکیه':'Europe/Istanbul',
      sydney:'Australia/Sydney', australia:'Australia/Sydney', 'سیدنی':'Australia/Sydney', 'استرالیا':'Australia/Sydney',
      'los angeles':'America/Los_Angeles', 'لس آنجلس':'America/Los_Angeles',
      toronto:'America/Toronto', canada:'America/Toronto', 'تورنتو':'America/Toronto', 'کانادا':'America/Toronto',
      madrid:'Europe/Madrid', spain:'Europe/Madrid', 'مادرید':'Europe/Madrid', 'اسپانیا':'Europe/Madrid',
      rome:'Europe/Rome', italy:'Europe/Rome', 'رم':'Europe/Rome', 'ایتالیا':'Europe/Rome',
      cairo:'Africa/Cairo', egypt:'Africa/Cairo', 'قاهره':'Africa/Cairo', 'مصر':'Africa/Cairo',
      delhi:'Asia/Kolkata', india:'Asia/Kolkata', 'دهلی':'Asia/Kolkata', 'هند':'Asia/Kolkata',
      riyadh:'Asia/Riyadh', 'saudi arabia':'Asia/Riyadh', 'ریاض':'Asia/Riyadh', 'عربستان':'Asia/Riyadh'
    };

    function findTimezoneMatch(target){
      const norm = target.toLowerCase().trim().replace(/[؟?.!]/g, '');
      if (!norm) return null;
      if (TIMEZONE_MAP[norm]) return TIMEZONE_MAP[norm];
      const normNoSpace = norm.replace(/\s+/g, '');
      for (const key in TIMEZONE_MAP) {
        const keyNoSpace = key.replace(/\s+/g, '');
        if (normNoSpace.includes(keyNoSpace) || keyNoSpace.includes(normNoSpace)) return TIMEZONE_MAP[key];
      }
      return null;
    }

    // ---- rock, paper, scissors ----
    let rpsState = null; // null | 'choice' | 'replay'
    let rpsBotChoice = null;
    const RPS_WORDS_FA = { 'سنگ':'rock', 'کاغذ':'paper', 'قیچی':'scissors' };
    const RPS_FA_NAME  = { rock:'سنگ', paper:'کاغذ', scissors:'قیچی' };

    function rpsPick(){
      const c = ['rock','paper','scissors'];
      return c[Math.floor(Math.random() * 3)];
    }
    function rpsBeats(a, b){
      return (a === 'rock' && b === 'scissors') || (a === 'paper' && b === 'rock') || (a === 'scissors' && b === 'paper');
    }
    function extractRpsChoice(cmd){
      for (const w of ['rock','paper','scissors']) {
        if (new RegExp(`\\b${w}\\b`, 'i').test(cmd)) return w;
      }
      for (const fa in RPS_WORDS_FA) {
        if (cmd.includes(fa)) return RPS_WORDS_FA[fa];
      }
      return null;
    }
    function isAffirmative(cmd){
      return /\b(yes|yeah|yep|sure|okay|ok)\b/i.test(cmd) || /(بله|آره|اره|باشه)/.test(cmd);
    }
    function isNegative(cmd){
      return /\b(no|nope|nah)\b/i.test(cmd) || /(نه|خیر|نمی[\s‌]?خوام)/.test(cmd);
    }

    // ---- AI connection ----
    let apiKey = '';
    const gearBtn = document.getElementById('gearBtn');
    gearBtn.addEventListener('click', () => {
      const entered = prompt('کلید API جمینای (Google AI Studio) رو وارد کن (فقط توی همین session نگه داشته می‌شه):', apiKey);
      if (entered !== null) {
        apiKey = entered.trim();
        speak(apiKey ? 'کلید ذخیره شد.' : 'کلید پاک شد.');
      }
    });

    async function askAI(question){
      if (!apiKey) {
        speak('برای این سوال باید اول کلید API رو از دکمه‌ی دنده وارد کنی.');
        return;
      }
      mainLine.innerHTML = 'در حال فکر کردن<span class="thinking-dot"></span>';
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: 'You are JARVIS, a concise voice assistant. Answer in 1-3 short spoken sentences, plain text, no markdown, no lists. Always reply in English, even if the question was asked in Persian.' }]
            },
            contents: [{ role: 'user', parts: [{ text: question }] }]
          })
        });
        if (!res.ok) {
          const errBody = await res.text();
          throw new Error(`${res.status}: ${errBody.slice(0,150)}`);
        }
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join(' ').trim();
        speak(text || 'جوابی دریافت نشد.');
      } catch (err) {
        showError('خطای اتصال به هوش مصنوعی: ' + err.message);
        mainLine.textContent = 'اتصال ناموفق بود.';
      }
    }

    // ---- fallback web answer (used when no API key is set) ----
    // Tries Wikipedia's free, key-less REST API first (CORS-enabled); if it
    // can't find a direct answer, falls back to opening a Google search tab.
    async function answerFromWeb(question){
      mainLine.innerHTML = 'در حال جستجو<span class="thinking-dot"></span>';
      try {
        const searchUrl = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(question)}&limit=1&namespace=0&format=json&origin=*`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();
        const title = searchData?.[1]?.[0];

        if (title) {
          const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
          const summaryRes = await fetch(summaryUrl);
          if (summaryRes.ok) {
            const summaryData = await summaryRes.json();
            const extract = (summaryData.extract || '').trim();
            if (extract) {
              const sentences = extract.match(/[^.!?]+[.!?]+/g) || [extract];
              const short = sentences.slice(0, 3).join(' ').trim();
              speak(`${short} That's from Wikipedia.`);
              return;
            }
          }
        }

        // no direct answer found — fall back to a Google search tab
        window.open(`https://www.google.com/search?q=${encodeURIComponent(question)}`, '_blank');
        speak(`I couldn't find a direct answer, so I opened a Google search for "${question}". Add an API key from the gear icon for smarter answers.`);
      } catch (err) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(question)}`, '_blank');
        speak('I ran into an issue searching, so I opened Google instead.');
      }
    }

    // ---- command handling ----
    // Best-effort "installed app" launcher: the browser can't truly enumerate
    // installed apps, so we try a known mobile deep-link scheme for the
    // requested name, detect whether the OS actually switched away (blur) to
    // handle it, and otherwise fall back to that app's website, and finally
    // to a plain Google search of the name if we don't recognize it at all.
    const APP_REGISTRY = {
      instagram:      { scheme: 'instagram://app',   web: 'https://www.instagram.com' },
      telegram:       { scheme: 'tg://resolve',       web: 'https://web.telegram.org' },
      whatsapp:       { scheme: 'whatsapp://send',    web: 'https://web.whatsapp.com' },
      youtube:        { scheme: 'youtube://',         web: 'https://www.youtube.com' },
      twitter:        { scheme: 'twitter://',         web: 'https://twitter.com' },
      x:              { scheme: 'twitter://',         web: 'https://twitter.com' },
      gmail:          { scheme: 'googlegmail://',     web: 'https://mail.google.com' },
      maps:           { scheme: 'comgooglemaps://',   web: 'https://maps.google.com' },
      'google maps':  { scheme: 'comgooglemaps://',   web: 'https://maps.google.com' },
      spotify:        { scheme: 'spotify://',         web: 'https://open.spotify.com' },
      netflix:        { scheme: 'nflx://',            web: 'https://www.netflix.com' },
      facebook:       { scheme: 'fb://',              web: 'https://www.facebook.com' },
      tiktok:         { scheme: 'tiktok://',          web: 'https://www.tiktok.com' },
      snapchat:       { scheme: 'snapchat://',        web: 'https://www.snapchat.com' },
      discord:        { scheme: 'discord://',         web: 'https://discord.com/app' },
      reddit:         { scheme: 'reddit://',          web: 'https://www.reddit.com' },
      linkedin:       { scheme: 'linkedin://',        web: 'https://www.linkedin.com' },
      amazon:         { scheme: null,                 web: 'https://www.amazon.com' },
      github:         { scheme: null,                 web: 'https://github.com' },
      google:         { scheme: null,                 web: 'https://www.google.com' },
      wikipedia:      { scheme: null,                 web: 'https://www.wikipedia.org' }
    };

    function findAppMatch(target){
      const norm = target.toLowerCase().replace(/\bapp\b/g, '').trim();
      if (!norm) return null;
      if (APP_REGISTRY[norm]) return { key: norm, ...APP_REGISTRY[norm] };
      for (const key in APP_REGISTRY) {
        if (norm.includes(key) || key.includes(norm)) return { key, ...APP_REGISTRY[key] };
      }
      return null;
    }

    function attemptOpenApp(match, displayName){
      speak(`Opening ${displayName}.`);
      let didBlur = false;
      const blurHandler = () => { didBlur = true; };
      window.addEventListener('blur', blurHandler, { once: true });
      try { window.location.href = match.scheme; } catch (e) {}
      setTimeout(() => {
        window.removeEventListener('blur', blurHandler);
        if (!didBlur) {
          // app didn't seem to open (likely not installed) — fall back to its website
          window.open(match.web, '_blank');
          speak(`Looks like the ${displayName} app isn't installed, so I opened its website instead.`);
        }
      }, 1200);
    }

    function handleCommand(raw){
      let cmd = raw.toLowerCase().trim();
      cmd = cmd.replace(/^(hey |ok |okay )?jarvis[,.\s]*/i, '').trim();
      cmd = cmd.replace(/^(هی |اوکی )?جارویس[،,.\s]*/, '').trim();
      if (!cmd) { speak('Yes, sir?'); return; }

      log('user', raw);
      subLine.textContent = `«${cmd}»`;

      // ---- rock, paper, scissors: mid-game state takes priority over
      // everything else so "rock" / "yes" etc. are read as game moves.
      // The bot's pick stays hidden until the player answers. ----
      if (rpsState === 'choice') {
        const userChoice = extractRpsChoice(cmd);
        if (userChoice) {
          let resultMsg;
          if (userChoice === rpsBotChoice) {
            resultMsg = `It's a tie.`;
          } else if (rpsBeats(rpsBotChoice, userChoice)) {
            resultMsg = `I win!`;
          } else {
            resultMsg = `You win!`;
          }
          rpsState = 'replay';
          speak(`You picked ${userChoice}, I picked ${rpsBotChoice} — ${resultMsg} Want to play again?`);
          return;
        }
      }
      if (rpsState === 'replay') {
        if (isAffirmative(cmd)) {
          rpsBotChoice = rpsPick();
          rpsState = 'choice';
          speak(`Alright, new round! What's your choice — rock, paper, or scissors?`);
          return;
        } else if (isNegative(cmd)) {
          rpsState = null; rpsBotChoice = null;
          speak('Alright, game over!');
          return;
        }
      }
      if (/let'?s play rock,?\s*paper,?\s*scissors?/i.test(cmd) || /سنگ\s*کاغذ\s*قیچی/.test(cmd)) {
        rpsBotChoice = rpsPick();
        rpsState = 'choice';
        speak(`Okay, let's play! What's your choice — rock, paper, or scissors?`);
        return;
      }

      // personality / small talk — checked before the generic AI fallback
      if (/how('?s| is| are) you doing/.test(cmd)) { speak(randomPick(HOW_ARE_YOU_DOING_REPLIES)); return; }
      if (/how('?s| is| are) you/.test(cmd) || /حالت چطوره/.test(cmd)) { speak(randomPick(HOW_ARE_YOU_REPLIES)); return; }
      if (/what'?s up/.test(cmd) || /چه خبر/.test(cmd)) { speak(randomPick(WHATS_UP_REPLIES)); return; }
      if (/favorite colou?r/.test(cmd) || /رنگ مورد علاقه/.test(cmd)) {
        speak(`My favorite color is ${randomPick(RAINBOW_COLORS)}.`);
        return;
      }
      if (/who('s| is) your (developer|creator|maker)/.test(cmd) || /سازنده(‌ات| تو)? کیه/.test(cmd) || /چه کسی (تو رو|شما رو) ساخته/.test(cmd)) {
        speak('Mohammad Erfan Kheradmand made me!');
        return;
      }
      if (/what'?s your name/.test(cmd) || /who are you/.test(cmd) || /اسمت چیه/.test(cmd) || /اسم تو چیه/.test(cmd)) {
        speak("I'm Jarvis.");
        return;
      }
      if (/capital of iran/.test(cmd) || /پایتخت ایران/.test(cmd)) { speak('Tehran.'); return; }

      // translate "<word>" [to "<language>"]
      let tm = cmd.match(/^translate\s+"?([^"]+?)"?\s+to\s+([a-zA-Z\u0600-\u06FF\s]+?)[\?？.]?$/i)
             || cmd.match(/^ترجمه(?:\s+کن)?\s+"?([^"]+?)"?\s+به\s+([a-zA-Z\u0600-\u06FF\s]+?)[؟?.]?$/)
             || cmd.match(/^translate\s+"?([^"]+?)"?[\?？.]?$/i)
             || cmd.match(/^ترجمه(?:\s+کن)?\s+"?([^"]+?)"?[؟?.]?$/);
      if (tm) {
        const word = tm[1].trim();
        const targetName = tm[2] ? tm[2].trim() : null;
        translateWord(word, targetName);
        return;
      }

      // open "<app name>" app — look for a matching known app, else its
      // website, else just Google-search the name so the user can find it themselves
      let m = cmd.match(/^open\s+(.+)$/i) || cmd.match(/^launch\s+(.+)$/i);
      if (m) {
        const target = m[1].trim().replace(/^["'“”]+|["'“”.]+$/g, '');
        const match = findAppMatch(target);
        if (match && match.scheme) {
          attemptOpenApp(match, target);
        } else if (match && match.web) {
          window.open(match.web, '_blank');
          speak(`Opening the ${target} website.`);
        } else {
          window.open(`https://www.google.com/search?q=${encodeURIComponent(target)}`, '_blank');
          speak(`I couldn't find "${target}" as an app, so I searched Google for it.`);
        }
        return;
      }

      // search for X
      m = cmd.match(/^search (for )?(.+)$/i);
      if (m) {
        const q = m[2].trim().replace(/^["'“”]+|["'“”.]+$/g, '');
        window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
        speak(`Searching for ${q}.`);
        return;
      }

      // date — Gregorian + Persian (Jalali) + Islamic (Hijri), all spelled
      // out with English letters/digits so speech synthesis can read them
      if (/date/.test(cmd) || /تاریخ/.test(cmd)) {
        const d = new Date();
        const gregorian = d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
        const jalali = formatJalaliEnglish(d);
        let hijri;
        try {
          hijri = new Intl.DateTimeFormat('en-US-u-ca-islamic', { year:'numeric', month:'long', day:'numeric' }).format(d);
        } catch (e) {
          hijri = 'unavailable';
        }
        speak(`Today is ${gregorian} in the Gregorian calendar, ${jalali} in the Persian calendar, and ${hijri} in the Islamic calendar.`);
        return;
      }

      // time in "<place>" — e.g. "what time is it in Italy" / "what's the time in Tokyo"
      let tzM = cmd.match(/what(?:'?s| is)?\s*(?:the\s+)?time(?:\s+is\s+it)?\s+in\s+(.+?)[\?？.]?$/i)
              || cmd.match(/ساعت\s+(?:در|توی)\s+(.+?)\s+چند(?:ه|\s+است)?[؟?.]?$/)
              || cmd.match(/ساعت\s+(.+?)\s+چند(?:ه|\s+است)?[؟?.]?$/);
      if (tzM) {
        const place = tzM[1].trim();
        const tz = findTimezoneMatch(place);
        if (tz) {
          try {
            const timeStr = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', timeZone: tz });
            speak(`It's ${timeStr} in ${place}.`);
          } catch (e) {
            speak(`I couldn't find the time zone for ${place}.`);
          }
        } else {
          speak(`Sorry, I don't recognize the time zone for ${place}.`);
        }
        return;
      }

      // time (general) — only fires on the exact phrase, so it doesn't
      // swallow "what time is it in <place>" queries
      if (/^what time is it\??$/i.test(cmd) || /^what'?s the time\??$/i.test(cmd) || /^ساعت چنده؟?$/.test(cmd)) {
        const d = new Date();
        const timeStr = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
        speak(`It's ${timeStr}.`);
        return;
      }

      // anything else -> ask the AI, or if no API key is set, fall back to a web/Wikipedia lookup
      if (apiKey) {
        askAI(cmd);
      } else {
        answerFromWeb(cmd);
      }
    }

    // ---- speech recognition ----
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizing = false;
    let listeningSession = false; // true while we intend to keep capturing, across chained restarts
    let recognition = null;

    if (!SR) {
      const overlay = document.createElement('div');
      overlay.className = 'unsupported';
      overlay.innerHTML = 'مرورگرت از تشخیص گفتار پشتیبانی نمی‌کنه.<br>لطفاً این فایل رو با Google Chrome یا Microsoft Edge باز کن.';
      document.body.appendChild(overlay);
    } else if (!window.isSecureContext && location.protocol === 'file:') {
      showError('این مرورگر برای فایل‌های محلی (file://) اجازه‌ی میکروفون نمی‌ده. فایل رو با یه سرور محلی یا از روی https باز کن.');
    } else {
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = recogLang;

      recognition.onstart = () => {
        recognizing = true;
        clearError();
        reactor.classList.add('listening');
        micState.textContent = 'LIVE';
        sysState.textContent = 'ACTIVE';
      };

      recognition.onend = () => {
        recognizing = false;
        reactor.classList.remove('listening');
        micState.textContent = 'OFF';
        sysState.textContent = 'STANDBY';
        if (listeningSession) {
          // this device stops the engine after one chunk regardless of "continuous" —
          // restart immediately so we keep capturing the rest of the sentence
          setTimeout(() => { try { recognition.start(); } catch (e) {} }, 150);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          listeningSession = false;
          showError('دسترسی به میکروفون رد شده. روی آیکن قفل کنار آدرس‌بار بزن و اجازه‌ی میکروفون رو فعال کن.');
        } else if (e.error === 'no-speech' || e.error === 'aborted') {
          if (listeningSession && voiceAccum && !confirmMode) {
            // a pause after already capturing something, with confirmation off — treat as end of sentence
            finalizeCapture(true);
          }
          // otherwise ignore — onend will restart if we're still in a listening session
        } else {
          showError('خطای تشخیص گفتار: ' + e.error);
        }
      };

      recognition.onresult = (event) => {
        let interim = '';
        let lastFinal = null;

        for (let i = 0; i < event.results.length; i++) {
          const r = event.results[i];
          if (r.isFinal) {
            lastFinal = r[0].transcript;
          } else {
            interim = r[0].transcript;
          }
        }

        if (interim) {
          subLine.textContent = cleanVoiceCommand(
            `${voiceAccum} ${interim}`.trim()
          );
        }

        if (lastFinal) {
          // Accumulate final chunks in BOTH modes so the command is not
          // replaced by only the newest recognized word/chunk.
          const combined = `${voiceAccum} ${lastFinal}`.trim();
          const cleaned = cleanVoiceCommand(combined);

          if (!cleaned) {
            // Only acknowledge an actual wake word. Pressing the reactor/button
            // must NOT trigger "Yes, sir?" by itself.
            const heardText = lastFinal.trim();
            const heardWakeWord = /\b(?:hey\s+|ok\s+|okay\s+)?jarvis\b/i.test(heardText)
              || /(هی |اوکی )?جارویس/.test(heardText);
            if (heardWakeWord && !voiceAccum) {
              speak('Yes, sir?');
              subLine.textContent = '';
            }
            return;
          }

          voiceAccum = cleaned;
          subLine.textContent = voiceAccum;

          if (confirmMode) {
            askConfirmation(voiceAccum);
          }
          // Confirmation OFF uses the exact same accumulation; execution
          // happens in finalizeCapture(true) after the capture ends.
        }
      };

      reactor.addEventListener('click', () => {
        clearError();
        if (listeningSession) {
          if (confirmMode) {
            listeningSession = false;
            recognition.stop(); // leaves any open confirm panel in place, awaiting Yes/No
          } else {
            finalizeCapture(true); // no panel in this mode — manual stop means "run it now"
          }
        } else {
          listeningSession = true;
          voiceAccum = '';
          confirmBox.style.display = 'none';
          pendingConfirmText = null;
          speechSynthesis.cancel();
          try {
            recognition.start();
          } catch (e) {
            listeningSession = false;
            showError('شروع نشد: ' + e.message);
          }
        }
      });
    }
  </script>
</body>
</html>
