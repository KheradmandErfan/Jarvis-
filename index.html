<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070a;
    --bg-deep: #020304;
    --ember: #ff8a2b;
    --ember-hot: #ffc266;
    --ember-dim: #7a3d10;
    --ring-track: #1c1408;
    --text: #f3ead9;
    --text-dim: #a68f6e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 30%, #0d0704 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text);
    font-family:'Rajdhani',sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    padding:24px;
  }

  /* ---------- top status bar ---------- */
  .status-bar{
    position:absolute;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:28px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    color: var(--text-dim);
  }
  .status-bar span.value{ color: var(--ember-hot); }

  /* ---------- reactor core ---------- */
  .reactor-wrap{
    position:relative;
    width:min(72vw, 420px);
    height:min(72vw, 420px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }

  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--ring-track);
  }
  .ring--outer{
    inset:0;
    border-color:#221407;
    animation: spin 40s linear infinite;
  }
  .ring--outer::before, .ring--outer::after{
    content:"";
    position:absolute;
    width:6px; height:6px;
    background: var(--ember-dim);
    border-radius:50%;
    top:-3px; left:calc(50% - 3px);
  }
  .ring--outer::after{ top:auto; bottom:-3px; }

  .ring--dashed{
    inset:9%;
    border:2px dashed var(--ember-dim);
    animation: spin-rev 26s linear infinite;
    opacity:.55;
  }

  .ring--tick{
    inset:18%;
    animation: spin 60s linear infinite;
  }
  .ring--tick svg{ width:100%; height:100%; display:block; }

  .core{
    position:absolute;
    inset:30%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 45%, var(--ember-hot) 0%, var(--ember) 38%, #3a1c06 78%, transparent 100%);
    box-shadow:
      0 0 30px 6px rgba(255,138,43,.55),
      0 0 90px 30px rgba(255,138,43,.22),
      inset 0 0 20px rgba(255,255,255,.25);
    animation: breathe 3.2s ease-in-out infinite;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .core-inner{
    width:38%;
    height:38%;
    border-radius:50%;
    background: radial-gradient(circle, #fff4df 0%, var(--ember-hot) 55%, transparent 100%);
    filter: blur(0.3px);
  }

  .reactor-wrap.listening .core{
    animation: breathe-fast 1s ease-in-out infinite;
  }
  .reactor-wrap.listening .ring--dashed{
    animation-duration: 8s;
    opacity:.9;
  }
  .reactor-wrap.speaking .core{
    animation: breathe-fast .55s ease-in-out infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes spin-rev{ to{ transform: rotate(-360deg); } }
  @keyframes breathe{
    0%,100%{ transform: scale(1); filter:brightness(1); }
    50%{ transform: scale(1.035); filter:brightness(1.15); }
  }
  @keyframes breathe-fast{
    0%,100%{ transform: scale(1); filter:brightness(1); }
    50%{ transform: scale(1.09); filter:brightness(1.3); }
  }

  /* ---------- caption / readout ---------- */
  .readout{
    margin-top:36px;
    min-height:64px;
    max-width:560px;
    text-align:center;
  }
  .readout .label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    color: var(--ember-dim);
    margin-bottom:6px;
  }
  .readout .line{
    font-size:19px;
    font-weight:500;
    color: var(--text);
    line-height:1.4;
  }
  .readout .line.dim{ color: var(--text-dim); font-size:15px; }

  /* ---------- log ---------- */
  .log{
    position:absolute;
    bottom:26px;
    left:50%;
    transform:translateX(-50%);
    width:min(90vw, 560px);
    max-height:110px;
    overflow-y:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color: var(--text-dim);
    text-align:left;
    scrollbar-width:none;
  }
  .log::-webkit-scrollbar{ display:none; }
  .log div{ padding:2px 0; border-bottom:1px solid #14100a; }
  .log div.user span{ color:var(--ember-hot); }
  .log div.sys span{ color:#7d8f9c; }

  .hint{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color: var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.05em;
    text-align:center;
    max-width:80vw;
  }

  .unsupported{
    position:absolute;
    inset:0;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    font-size:16px;
    color: var(--text-dim);
    z-index:50;
  }

  .error-banner{
    position:absolute;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    max-width:80vw;
    background: rgba(120,20,10,.18);
    border:1px solid #7a2a10;
    color:#ffb499;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:4px;
    text-align:center;
    display:none;
  }

  .top-right-controls{
    position:absolute;
    top:20px;
    right:18px;
    display:flex;
    gap:6px;
  }

  .gear-btn{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid var(--ember-dim);
    background:transparent;
    color: var(--text-dim);
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gear-btn:hover{ color: var(--ember-hot); border-color: var(--ember-hot); }
  .gear-btn.active{
    color: var(--bg);
    background: var(--ember-hot);
    border-color: var(--ember-hot);
  }

  .thinking-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--ember-hot);
    margin-left:4px;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:.2;} 50%{opacity:1;} }

  .text-input-row{
    margin-top:22px;
    display:flex;
    gap:8px;
    width:min(90vw, 420px);
  }
  .text-input-row input{
    flex:1;
    background: rgba(255,255,255,.03);
    border:1px solid var(--ring-track);
    border-radius:6px;
    padding:10px 12px;
    color: var(--text);
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    outline:none;
  }
  .text-input-row input:focus{ border-color: var(--ember-dim); }
  .text-input-row input::placeholder{ color:#5c503d; }
  .text-input-row button{
    width:42px;
    border-radius:6px;
    border:1px solid var(--ember-dim);
    background:transparent;
    color: var(--ember-hot);
    font-size:16px;
    cursor:pointer;
  }
  .text-input-row button:hover{ background: var(--ember-dim); }

  .confirm-box{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:22px;
    padding:16px 20px;
    max-width:min(90vw, 460px);
    border:1px solid var(--ember-dim);
    border-radius:8px;
    background: rgba(255,138,43,.06);
  }
  .confirm-box .confirm-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color: var(--ember-dim);
  }
  .confirm-box .confirm-text{
    text-align:center;
    font-size:17px;
    color: var(--text);
  }
  .confirm-actions{ display:flex; gap:14px; }
  .confirm-btn{
    padding:8px 22px;
    border-radius:6px;
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    border:1px solid;
  }
  .confirm-btn.yes{
    background: var(--ember);
    border-color: var(--ember);
    color: #1a0e04;
  }
  .confirm-btn.no{
    background:transparent;
    border-color: var(--text-dim);
    color: var(--text-dim);
  }
</style>
</head>
<body>

  <div class="top-right-controls">
    <button class="gear-btn active" id="confirmToggleBtn" title="تأیید قبل از اجرا">✓</button>
    <button class="gear-btn" id="gearBtn" title="API Key">⚙</button>
  </div>

  <div class="status-bar">
    <div>SYS <span class="value" id="sysState">STANDBY</span></div>
    <div>MIC <span class="value" id="micState">OFF</span></div>
    <div>CLOCK <span class="value" id="clockVal">--:--:--</span></div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="reactor-wrap" id="reactor">
    <div class="ring ring--outer"></div>
    <div class="ring ring--dashed"></div>
    <div class="ring ring--tick">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#2a1a0a" stroke-width="1" stroke-dasharray="1 4.2"/>
      </svg>
    </div>
    <div class="core"><div class="core-inner"></div></div>
  </div>

  <div class="readout">
    <div class="label">READOUT</div>
    <div class="line" id="mainLine">آماده‌ام، آقای استارک.</div>
    <div class="line dim" id="subLine"></div>
  </div>

  <div class="confirm-box" id="confirmBox">
    <div class="confirm-label">CONFIRM COMMAND</div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button class="confirm-btn yes" id="confirmYes">✓ Yes</button>
      <button class="confirm-btn no" id="confirmNo">✗ No</button>
    </div>
  </div>

  <div class="text-input-row">
    <input type="text" id="textCmdInput" placeholder="یا اینجا تایپ کن...">
    <button id="textCmdSend">➤</button>
  </div>

  <div class="log" id="log"></div>

  <script>
    const reactor   = document.getElementById('reactor');
    const mainLine  = document.getElementById('mainLine');
    const subLine   = document.getElementById('subLine');
    const logEl     = document.getElementById('log');
    const micState  = document.getElementById('micState');
    const sysState  = document.getElementById('sysState');
    const clockVal  = document.getElementById('clockVal');

    // ---- live clock ----
    function tickClock(){
      const d = new Date();
      clockVal.textContent = d.toLocaleTimeString('en-GB');
    }
    setInterval(tickClock, 1000);
    tickClock();

    function randomPick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

    const HOW_ARE_YOU_REPLIES = [
      "I'm doing well, thank you for asking.",
      "All systems are running smoothly, sir.",
      "Can't complain, my arc reactor's at full charge.",
      "Better now that you're here."
    ];
    const HOW_ARE_YOU_DOING_REPLIES = [
      "Standing by and ready for your command, sir.",
      "Always at your service.",
      "Fully operational and awaiting instructions.",
      "Everything's running perfectly on my end."
    ];
    const RAINBOW_COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet'];

    // ---- error banner ----
    const errorBanner = document.getElementById('errorBanner');
    function showError(msg){
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }
    function clearError(){
      errorBanner.style.display = 'none';
    }

    // ---- logging ----
    function log(role, text){
      const row = document.createElement('div');
      row.className = role;
      row.innerHTML = `<span>${role === 'user' ? 'YOU' : 'JARVIS'}</span> — ${text}`;
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ---- speech synthesis ----
    function speak(text){
      mainLine.textContent = text;
      if (!('speechSynthesis' in window)) { log('sys', text); return; }
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.02;
      utter.pitch = 0.85;
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => /en-GB|en-US/.test(v.lang) && /male|daniel|david|alex/i.test(v.name))
                      || voices.find(v => /en-GB/.test(v.lang))
                      || voices.find(v => /en/.test(v.lang));
      if (preferred) utter.voice = preferred;

      reactor.classList.add('speaking');
      utter.onend = () => reactor.classList.remove('speaking');
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
      log('sys', text);
    }

    // ---- confirm-before-execute toggle ----
    let confirmMode = true;
    const confirmToggleBtn = document.getElementById('confirmToggleBtn');
    confirmToggleBtn.addEventListener('click', () => {
      confirmMode = !confirmMode;
      confirmToggleBtn.classList.toggle('active', confirmMode);
      confirmToggleBtn.title = confirmMode ? 'تأیید قبل از اجرا: روشن' : 'تأیید قبل از اجرا: خاموش';
    });

    const confirmBox  = document.getElementById('confirmBox');
    const confirmText = document.getElementById('confirmText');
    const confirmYes  = document.getElementById('confirmYes');
    const confirmNo   = document.getElementById('confirmNo');
    let pendingConfirmText = null;

    function askConfirmation(text){
      pendingConfirmText = text;
      confirmText.textContent = `«${text}»`;
      confirmBox.style.display = 'flex';
    }
    confirmYes.addEventListener('click', () => {
      confirmBox.style.display = 'none';
      const t = pendingConfirmText;
      pendingConfirmText = null;
      if (t) handleCommand(t);
    });
    confirmNo.addEventListener('click', () => {
      confirmBox.style.display = 'none';
      pendingConfirmText = null;
      mainLine.textContent = 'لغو شد.';
    });

    function stripWake(text){
      return text.toLowerCase().trim().replace(/^(hey |ok |okay )?jarvis[,.\s]*/i, '').trim();
    }

    // ---- typed command input ----
    const textCmdInput = document.getElementById('textCmdInput');
    const textCmdSend  = document.getElementById('textCmdSend');
    function sendTypedCommand(){
      const val = textCmdInput.value.trim();
      if (!val) return;
      textCmdInput.value = '';
      handleCommand(val);
    }
    textCmdSend.addEventListener('click', sendTypedCommand);
    textCmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendTypedCommand();
    });

    // ---- AI connection ----
    let apiKey = '';
    const gearBtn = document.getElementById('gearBtn');
    gearBtn.addEventListener('click', () => {
      const entered = prompt('کلید API جمینای (Google AI Studio) رو وارد کن (فقط توی همین session نگه داشته می‌شه):', apiKey);
      if (entered !== null) {
        apiKey = entered.trim();
        speak(apiKey ? 'کلید ذخیره شد.' : 'کلید پاک شد.');
      }
    });

    async function askAI(question){
      if (!apiKey) {
        speak('برای این سوال باید اول کلید API رو از دکمه‌ی دنده وارد کنی.');
        return;
      }
      mainLine.innerHTML = 'در حال فکر کردن<span class="thinking-dot"></span>';
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: 'You are JARVIS, a concise voice assistant. Answer in 1-3 short spoken sentences, plain text, no markdown, no lists.' }]
            },
            contents: [{ role: 'user', parts: [{ text: question }] }]
          })
        });
        if (!res.ok) {
          const errBody = await res.text();
          throw new Error(`${res.status}: ${errBody.slice(0,150)}`);
        }
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join(' ').trim();
        speak(text || 'جوابی دریافت نشد.');
      } catch (err) {
        showError('خطای اتصال به هوش مصنوعی: ' + err.message);
        mainLine.textContent = 'اتصال ناموفق بود.';
      }
    }

    // ---- command handling ----
    const SITES = {
      google:    'https://www.google.com',
      youtube:   'https://www.youtube.com',
      gmail:     'https://mail.google.com',
      github:    'https://github.com',
      wikipedia: 'https://www.wikipedia.org',
      maps:      'https://maps.google.com',
      'google maps': 'https://maps.google.com'
    };

    function handleCommand(raw){
      let cmd = raw.toLowerCase().trim();
      cmd = cmd.replace(/^(hey |ok |okay )?jarvis[,.\s]*/i, '').trim();
      if (!cmd) { speak('Yes, sir?'); return; }

      log('user', raw);
      subLine.textContent = `«${cmd}»`;

      // personality / small talk — checked before the generic AI fallback
      if (/how('?s| is| are) you doing/.test(cmd)) { speak(randomPick(HOW_ARE_YOU_DOING_REPLIES)); return; }
      if (/how('?s| is| are) you/.test(cmd)) { speak(randomPick(HOW_ARE_YOU_REPLIES)); return; }
      if (/favorite colou?r/.test(cmd)) { speak(`My favorite color is ${randomPick(RAINBOW_COLORS)}.`); return; }
      if (/who('s| is) your owner/.test(cmd)) { speak('Mohammad Erfan Kheradmand made me!'); return; }
      if (/capital of iran/.test(cmd)) { speak('Tehran.'); return; }

      // open <site>
      let m = cmd.match(/^open\s+(.+)$/i) || cmd.match(/^launch\s+(.+)$/i);
      if (m) {
        const target = m[1].trim().replace(/^["'“”]+|["'“”.]+$/g, '');
        const url = SITES[target] || `https://www.google.com/search?q=${encodeURIComponent(target)}`;
        window.open(url, '_blank');
        speak(SITES[target] ? `Opening ${target}.` : `I couldn't find "${target}" directly, so I searched for it.`);
        return;
      }

      // search for X
      m = cmd.match(/^search (for )?(.+)$/i);
      if (m) {
        const q = m[2].trim().replace(/^["'“”]+|["'“”.]+$/g, '');
        window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
        speak(`Searching for ${q}.`);
        return;
      }

      // date
      if (/date/.test(cmd)) {
        const d = new Date();
        const formatted = d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
        speak(`Today is ${formatted}.`);
        return;
      }

      // time
      if (/time/.test(cmd)) {
        const d = new Date();
        speak(`It's ${d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}.`);
        return;
      }

      // anything else -> ask the AI
      askAI(cmd);
    }

    // ---- speech recognition ----
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizing = false;
    let resultHandled = false;
    let recognition = null;

    if (!SR) {
      const overlay = document.createElement('div');
      overlay.className = 'unsupported';
      overlay.innerHTML = 'مرورگرت از تشخیص گفتار پشتیبانی نمی‌کنه.<br>لطفاً این فایل رو با Google Chrome یا Microsoft Edge باز کن.';
      document.body.appendChild(overlay);
    } else if (!window.isSecureContext && location.protocol === 'file:') {
      showError('این مرورگر برای فایل‌های محلی (file://) اجازه‌ی میکروفون نمی‌ده. فایل رو با یه سرور محلی یا از روی https باز کن.');
    } else {
      recognition = new SR();
      recognition.continuous = true;   // proven reliable on this device — fires final results as speech is recognized
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        recognizing = true;
        resultHandled = false;
        clearError();
        confirmBox.style.display = 'none';
        pendingConfirmText = null;
        reactor.classList.add('listening');
        micState.textContent = 'LIVE';
        sysState.textContent = 'ACTIVE';
      };

      recognition.onend = () => {
        recognizing = false;
        reactor.classList.remove('listening');
        micState.textContent = 'OFF';
        sysState.textContent = 'STANDBY';
        // no auto-restart — mic stays off until the user clicks the reactor again
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          showError('دسترسی به میکروفون رد شده. روی آیکن قفل کنار آدرس‌بار بزن و اجازه‌ی میکروفون رو فعال کن.');
        } else if (e.error === 'no-speech' || e.error === 'aborted') {
          // ignore
        } else {
          showError('خطای تشخیص گفتار: ' + e.error);
        }
      };

      recognition.onresult = (event) => {
        if (resultHandled) return; // once we've captured one command this session, ignore anything further

        let finalText = '';
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += t;
          else interim += t;
        }
        if (interim) subLine.textContent = interim;

        if (finalText) {
          resultHandled = true;
          const full = finalText.trim();
          subLine.textContent = full;
          try { recognition.stop(); } catch (e) {} // stop listening right after capturing one command

          if (!stripWake(full)) {
            handleCommand(full); // bare wake-word, e.g. "Jarvis" alone — just acknowledge
          } else if (confirmMode) {
            askConfirmation(full);
          } else {
            handleCommand(full);
          }
        }
      };

      reactor.addEventListener('click', () => {
        clearError();
        if (recognizing) {
          recognition.stop();
        } else {
          speechSynthesis.cancel();
          try {
            recognition.start();
          } catch (e) {
            showError('شروع نشد: ' + e.message);
          }
        }
      });
    }
  </script>
</body>
</html>
